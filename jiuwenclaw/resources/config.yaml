# JiuwenClaw Configuration Template
# Do not edit this file — override values in ~/.jiuwenclaw/config/config.yaml

channels:
  web:
    enabled: true
    host: "127.0.0.1"
    port: 19000
    path: "/ws"

models:
  default:
    model_client_config:
      api_base: ${API_BASE}
      api_key: ${API_KEY}
      model_name: ${MODEL_NAME}
      client_provider: ${MODEL_PROVIDER:-openai}
      timeout: 1800
      max_retries: 1
    model_config_obj:
      temperature: 0.95

react:
  window_round_num: 100

logging:
  level: INFO
