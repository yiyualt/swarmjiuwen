[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenclaw"
version = "0.1.0"
description = "JiuwenClaw — Multi-channel AI agent with message bus architecture"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "ruamel.yaml>=0.18.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[project.scripts]
jiuwenclaw-start = "jiuwenclaw.start_services:main"
jiuwenclaw-agentserver = "jiuwenclaw.app_agentserver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jiuwenclaw*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
